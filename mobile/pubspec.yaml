name: miniott
description: "Mini-OTT Project with voting"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  injectable: ^2.1.0
  intl: any
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.3.2
  go_router: ^17.1.0
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.1
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^6.0.0
  cached_network_image: ^3.2.0
  loading_animation_widget: ^1.2.0
  email_validator: ^3.0.0
  firebase_auth: ^5.1.1
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  flutter_local_notifications: ^21.0.0
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.1
  change_app_package_name: ^1.5.0
  logger: ^2.4.0
  form_validator: ^2.1.1
  jwt_decoder: ^2.0.1
  file_picker: ^11.0.2
  collection: ^1.18.0 
  permission_handler: ^12.0.1  # for handling runtime permissions
  google_fonts: ^8.0.2 # for Google Fonts
  font_awesome_flutter: ^11.0.0 # for icons
  flutter_easy_messages: ^0.2.0 # for showing easy messages like toasts and snackbars
  khalti: ^2.0.0 # for integrating Khalti payment gateway in Nepal
  webview_flutter: ^4.13.0 # for embedding web content like payment gateways and support pages
  flutter_gen_runner: ^5.13.0+1 # for generating code for assets and fonts
  onesignal_flutter: ^5.5.1 # for push notifications with OneSignal
  better_player_plus: ^1.0.5 # for video playback with advanced features like gesture controls and DRM support
  dartz: ^0.10.1 # for functional programming constructs like Either and Option
  google_sign_in: ^6.2.0 # for Google Sign-In (Android and iOS)
  sign_in_with_apple: ^6.0.0 # for Apple Sign-In (iOS)
  device_preview: ^1.3.1 # for checking responsiveness during development
  screen_protector: ^1.4.2+1   # for preventing screenshots and screen recording
  mirror_skeleton: ^0.3.1 # for skeleton loading screens
  screen_brightness: ^2.1.0   # adjust screen brightness via right-side drag in player
  flutter_volume_controller: ^1.3.2 # adjust system volume via left-side drag in player
  quick_actions: ^1.1.0 # for home screen quick actions (long-press app icon)


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  retrofit_generator: ^10.2.1
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - .env

